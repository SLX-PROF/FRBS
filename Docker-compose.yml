services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forbsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forbsa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-forbsa}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-forbsa}:${POSTGRES_PASSWORD:-forbsa_dev_password}@db:5432/${POSTGRES_DB:-forbsa}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
    volumes:
      - media:/app/public/media

volumes:
  pgdata:
  media: