services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: forbsa
      POSTGRES_PASSWORD: forbsa_dev_password
      POSTGRES_DB: forbsa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: .
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: change_me_in_production
      DATABASE_URL: postgresql://forbsa:forbsa_dev_password@db:5432/forbsa
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata: